name: "WoL Keeper"
version: "1.0.0"
slug: "wol_keeper"
description: "Keeps Wake-on-LAN (magic packet) enabled on a network interface, even after a clean shutdown — fixes drivers/NICs that reset this setting on every boot (e.g. Realtek r8169)."
url: "https://github.com/lyntoo/ha-wol-keeper-addon"
arch:
  - amd64
  - aarch64
  - armv7
startup: system
boot: auto
init: false
host_network: true
privileged:
  - NET_ADMIN
options:
  interface: ""
  check_interval: 300
schema:
  interface: str
  check_interval: int(30,3600)
